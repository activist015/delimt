<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#080808"/>
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FF3333" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Glow -->
  <radialGradient id="glow" cx="50%" cy="40%" r="50%">
    <stop offset="0%" stop-color="#FF3333" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#FF3333" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Badge -->
  <rect x="536" y="80" width="128" height="32" rx="16" fill="none" stroke="#FF3333" stroke-opacity="0.4" stroke-width="1"/>
  <text x="600" y="101" text-anchor="middle" font-family="monospace" font-size="12" fill="#FF3333" letter-spacing="4">⚡ DELIMT</text>
  <!-- Main headline -->
  <text x="600" y="210" text-anchor="middle" font-family="monospace" font-size="72" font-weight="900" fill="#E8E8E0">The AI that fights you</text>
  <text x="600" y="300" text-anchor="middle" font-family="monospace" font-size="72" font-weight="900" fill="#FF3333">for your own good.</text>
  <!-- Subtext -->
  <text x="600" y="390" text-anchor="middle" font-family="monospace" font-size="22" fill="#666666">Not a passive blocker. An active AI agent that argues</text>
  <text x="600" y="420" text-anchor="middle" font-family="monospace" font-size="22" fill="#666666">you out of your bad decisions in real time.</text>
  <!-- URL -->
  <text x="600" y="530" text-anchor="middle" font-family="monospace" font-size="18" fill="#333333" letter-spacing="3">delimt.com</text>
</svg>